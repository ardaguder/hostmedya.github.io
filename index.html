<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Proje | Hazırlanıyor</title>
    <style>
        :root {
            --bg-color: #0b0f19; /* Derin koyu mavi/siyah */
            --neon-cyan: #00f3ff;
            --neon-green: #00ffaa;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .card {
            text-align: center;
            padding: 3rem 2rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 243, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 243, 255, 0.05);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 243, 255, 0.15);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .action-btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="statusTitle">Altyapı Kuruluyor</h1>
        <p>Sistem şu anda yapılandırma aşamasında.<br>Çok yakında yayında olacağız.</p>
        <button class="action-btn" id="connectBtn">Sistem Testi Yap</button>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const statusTitle = document.getElementById('statusTitle');

        connectBtn.addEventListener('click', () => {
            // Butona tıklandığında neon yeşiline dönen küçük bir etkileşim
            statusTitle.textContent = 'Bağlantı Başarılı!';
            statusTitle.style.color = 'var(--neon-green)';
            statusTitle.style.textShadow = '0 0 15px rgba(0, 255, 170, 0.6)';
            
            connectBtn.style.color = 'var(--neon-green)';
            connectBtn.style.borderColor = 'var(--neon-green)';
            connectBtn.textContent = 'Sistem Aktif';
            connectBtn.style.boxShadow = '0 0 20px rgba(0, 255, 170, 0.3)';

            // 3 saniye sonra orijinal haline geri döndür
            setTimeout(() => {
                statusTitle.textContent = 'Altyapı Kuruluyor';
                statusTitle.style.color = 'var(--text-main)';
                statusTitle.style.textShadow = '0 0 12px rgba(0, 243, 255, 0.4)';
                
                connectBtn.style.color = 'var(--neon-cyan)';
                connectBtn.style.borderColor = 'var(--neon-cyan)';
                connectBtn.textContent = 'Sistem Testi Yap';
                connectBtn.style.boxShadow = 'none';
            }, 3000);
        });
    </script>
</body>
</html>
